<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontaktformular</title>

    <link rel="stylesheet" href="">
</head>

<body>

    <form action="mailto:DEINE-EMAIL@BEISPIEL.COM" method="post" enctype="text/plain">

        <label for="name">Name:</label>
        <input type="text" name="name" id="name" placeholder="Name">

        <br><br>

        <label for="male">Männlich:</label>
        <input type="radio" name="gender" id="male" value="male">

        <br><br>

        <label for="newsletter">Newsletter:</label>
        <input type="checkbox" name="newsletter" id="newsletter">

        <br><br>

        <label for="country">Land:</label>
        <select name="country" id="country">
            <option value="de">Deutschland</option>
            <option value="at">Österreich</option>
            <option value="ch">Schweiz</option>
        </select>

        <br><br>

        <label for="hobbies">Hobbys:</label>
        <select name="hobbies" id="hobbies" multiple>
            <option value="cooking">Kochen</option>
            <option value="badminton">Federball</option>
            <option value="tennis">Tennis</option>
        </select>

        <br><br>

        <label for="message">Nachricht:</label>
        <br>
        <textarea name="message" id="message" cols="30" rows="10" placeholder="Deine Nachricht"></textarea>

        <br><br>

        <input type="submit" value="Absenden">
        <input type="reset" value="Zurücksetzen">

    </form>

</body>

</html>
